# Model Registry — Definitive catalog for Modal-based inference deployment.
#
# Each [[models]] entry describes a model, its resource requirements, pricing,
# and the inference engine + endpoint shape needed to serve it on Modal GPUs.
#
# Fields:
#   model_id              — HuggingFace repo or canonical identifier
#   name                  — Short slug used in operator config and routing
#   task_type             — task category (see below)
#   gpu_type              — Modal GPU class: "H100" | "A100-80GB" | "A100-40GB" | "A10G" | "L40S" | "L4" | "T4"
#   gpu_count             — Number of GPUs per replica
#   vram_required_mib     — Minimum VRAM to load model weights + KV cache / activations
#   recommended_tp        — Tensor-parallel degree (must be <= gpu_count)
#   modal_image           — Base container image tag
#   inference_engine      — "service" (hand-written) | "vllm" | "sglang" | "diffusers" | "transformers" | "whisper" | "custom"
#   service_file          — (service engine only) filename in models/services/
#   endpoint_path         — Default inference endpoint path
#   context_length        — Max context window (text models only)
#   estimated_latency_ms  — p50 latency for a typical request
#   price_per_m_tokens    — USD per 1M tokens (text models)
#   price_per_image       — USD per image (image models)
#   price_per_second      — USD per second of generated media (audio/video)
#   notes                 — Deployment-specific caveats
#
# Task types:
#   text-generation, image-generation, video-generation,
#   video-avatar, video-lipsync, video-stitch, video-understanding,
#   tts, stt, s2s, music-generation, diarize, vad,
#   audio-processing, voice-conversion, embedding, rerank

