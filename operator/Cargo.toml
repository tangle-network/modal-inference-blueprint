[package]
name = "modal-inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "modal_inference"
path = "src/lib.rs"

[[bin]]
name = "modal-operator"
path = "src/main.rs"

[[bin]]
name = "standalone"
path = "src/bin/standalone.rs"

[dependencies]
blueprint-sdk = { workspace = true, features = ["tee"] }
alloy = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-primitives = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Shared inference operator infrastructure (billing, metrics, health, server helpers)
tangle-inference-core = { git = "https://github.com/tangle-network/tangle-inference-core", rev = "c7e11063a2ba30c662c64356a73bd81d4a03a267", default-features = false, features = ["billing", "http", "metrics"] }

# HTTP server
axum = { workspace = true }
tower-http = { workspace = true }

# Config
config = "0.14"
dotenvy = "0.15"
toml = "0.8"

# Streaming
futures-util = { workspace = true }
tokio-stream = { workspace = true }

# Misc
bytes = "1"

[dev-dependencies]
blueprint-sdk = { git = "https://github.com/tangle-network/blueprint", rev = "be8bd303260d3b1e1df6624eeac92b3ce1f40c38", package = "blueprint-sdk", features = ["testing", "tangle"] }
wiremock = "0.6"
