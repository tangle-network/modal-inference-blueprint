# Modal Inference Blueprint — Operator Configuration
#
# Copy to config/operator.toml and customize.

name = "My Inference Operator"

[gateway]
url = "https://api.gateway.tangle.tools"
# api_key = "plabs_..."     # Get from the gateway dashboard
# payout_email = "me@example.com"

[tangle]
# service_id = 12345
# blueprint_id = 42

[qos]
heartbeat_interval_secs = 30
metrics_interval_secs = 60
prometheus_port = 9090

[server]
port = 8080
host = "0.0.0.0"
max_concurrency = 10
timeout_secs = 120

[cost]
idle_shutdown_minutes = 30   # Stop Modal apps after 30min idle (0 = disabled)
idle_check_interval_minutes = 5

# ──────────────────────────────────────────────────────────
# Models — add one [[models]] block per Modal deployment.
# Use `python models/deploy.py gen-config --org your-org` to generate these.
# ──────────────────────────────────────────────────────────

[[models]]
name = "kokoro-tts"
type = "tts"
modal_endpoint = "https://your-org--inference-kokoro-tts-inference.modal.run"
price_per_1k = "0.001"

