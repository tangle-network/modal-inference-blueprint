# Allocate/retire the backend with blueprint-sdk remote providers.
# Supply the operator signing key through MODAL_OP_TANGLE__OPERATOR_KEY.
name = "Modal inference operator"
[tangle]
rpc_url = "http://127.0.0.1:8545"
chain_id = 31337
operator_key = ""
shielded_credits = "0x0000000000000000000000000000000000000000"
blueprint_id = 1
[server]
host = "127.0.0.1"
port = 8080
[billing]
billing_required = true
max_spend_per_request = 1000000
min_credit_balance = 1000
[modal]
price_per_1k_tts_chars = 5000
[[modal.models]]
name = "kokoro-tts"
type = "tts"
modal_endpoint = "https://allocated-endpoint.example.com"
health_path = "/health"
inference_path = "/synthesize"

# Set from the SDK lease hardware receipt before chain registration.
[gpu]
expected_gpu_count = 0
min_vram_mib = 0
gpu_model = ""
