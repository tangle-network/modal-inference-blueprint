[workspace]
members = ["operator"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tangle-network/modal-inference-blueprint"

[workspace.dependencies]
blueprint-sdk = { version = "0.2.0-alpha.6", features = ["std", "tangle", "macros"] }
blueprint-qos = { version = "0.2.0-alpha.6" }
blueprint-pricing-engine = { git = "https://github.com/tangle-network/blueprint", branch = "main" }
alloy = { version = "1", features = ["full", "signer-local", "provider-http"] }
alloy-sol-types = "1"
alloy-primitives = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
anyhow = "1"
thiserror = "2"
axum = { version = "0.7", features = ["json", "macros", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "limit", "trace", "timeout"] }
prometheus = "0.13"
futures-util = "0.3"
tokio-stream = "0.1"
rust_decimal = "1"
